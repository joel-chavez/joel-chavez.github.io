<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inches to Millimeters Converter</title>
    <style>
        /* Change input text color */
        #inches {
            color: blue; /* Change this to your desired color */
            font-size: 16px; /* Optional: adjust font size */
        }
    </style>
    <script>
        function convertToMM() {
            const inches = parseFloat(document.getElementById('inches').value);
            if (!isNaN(inches)) {
                const mm = inches * 25.4;
                document.getElementById('result').innerText = mm.toFixed(2) + ' mm';
            } else {
                document.getElementById('result').innerText = '';
            }
        }

        function convertToIN() {
      const  mm = parseFloat(document.getElementById('mm').value);
      const inches = mm / 25.4;
      document.getElementById('resultIN').innerText = inches.toFixed(2) + ' in';
    }
    </script>
</head>
<body>
    <h1>Inches to Millimeters Converter</h1>
    <label for="inches">Enter inches:</label>
    <input type="number" id="inches" step="0.01" placeholder="e.g., 1.5" required oninput="convertToMM()">
    <p id="result"></p>
    <label for="mm">Enter mm:</label>
    <input type="number" id="mm" step="0.01" style="color:black;" required oninput="convertToIN()">
    <p id="resultIN"></p>
</body>
</html>
